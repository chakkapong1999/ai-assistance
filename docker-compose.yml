# Local stack. Reviews default to the mock reviewer; the worker never calls an LLM here.
#
# Settings come from a .env file next to this one (cp .env.example .env). Compose uses it two ways:
# ${VAR:-default} below reads it, and the backend services also get every variable in it
# (env_file), so REVIEW_NEW_REPOS, CLAUDE_BIN and the like need no line here. Values under
# `environment:` win over env_file, which keeps DATABASE_URL pointing at the postgres container.
# The frontend gets no env_file on purpose: it must not see BITBUCKET_TOKEN and friends.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_review
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_review"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    command: ["--mode=api"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_review?sslmode=disable
      BITBUCKET_WEBHOOK_SECRET: ${BITBUCKET_WEBHOOK_SECRET:-dev-secret}
      # token:role[,token:role] - dev default only, set your own outside local use
      API_TOKENS: ${API_TOKENS:-dev-admin-token-change-me:admin}
      REVIEWER_MODE: mock
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  backend-worker:
    build: ./backend
    env_file:
      - path: .env
        required: false
    command: ["--mode=worker"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_review?sslmode=disable
      BITBUCKET_TOKEN: ${BITBUCKET_TOKEN:-dev-token}
      REVIEWER_MODE: ${REVIEWER_MODE:-mock}
      MOCK_REVIEW_SCENARIO: ${MOCK_REVIEW_SCENARIO:-findings}
      MOCK_REVIEW_DELAY: ${MOCK_REVIEW_DELAY:-2s}
      POLL_REPOS: ${POLL_REPOS:-}
      POLL_INTERVAL: ${POLL_INTERVAL:-5m}
      POLL_LOOKBACK: ${POLL_LOOKBACK:-168h}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    env_file:
      - path: .env
        required: false
    environment:
      API_BASE_URL: http://backend-api:8080
      # must be one of the tokens in API_TOKENS
      API_TOKEN: ${API_TOKEN:-dev-admin-token-change-me}
      DISPLAY_TZ: ${DISPLAY_TZ:-Asia/Bangkok}
    ports:
      - "3000:3000"
    depends_on:
      - backend-api

volumes:
  pgdata:
