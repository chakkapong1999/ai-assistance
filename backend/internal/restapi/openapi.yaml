openapi: 3.0.3
info:
  title: AI Code Review API
  version: 1.0.0
  description: |
    Read API for the dashboard, plus two admin actions. Authenticate with
    `Authorization: Bearer <token>`; tokens and roles come from `API_TOKENS`.
    This identifies the calling *server*, not an end user.
    Every operation carries `x-required-role` (none | viewer | admin); a test
    keeps it equal to what the server enforces.
servers:
  - url: /
security:
  - bearer: []
paths:
  /api/v1/openapi.yaml:
    get:
      summary: This document
      x-required-role: none
      security: []
      responses:
        "200": { description: The OpenAPI document, content: { application/yaml: { schema: { type: string } } } }
  /api/v1/me:
    get:
      summary: Role of the calling token and the user it belongs to
      description: |
        `user` is null for a token that is not linked to a person (the dashboard's
        shared read token, or an admin token without a user id).
      x-required-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [role, user]
                properties:
                  role: { type: string, enum: [viewer, author, senior, lead, admin] }
                  user:
                    nullable: true
                    type: object
                    required: [id, name]
                    properties: { id: { type: integer, format: int64 }, name: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/overview:
    get:
      summary: Totals and a daily series for the last N UTC days
      x-required-role: viewer
      parameters:
        - { $ref: "#/components/parameters/days" }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Overview" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/health:
    get:
      summary: Is the pipeline moving? What is waiting, what lost its job, when the worker last did its periodic work
      x-required-role: viewer
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/repositories:
    get:
      summary: List repositories
      x-required-role: viewer
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: Case-insensitive match on workspace/slug }
        - { name: review_enabled, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/offset" }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/RepositoryPage" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/repositories/{id}:
    parameters:
      - { $ref: "#/components/parameters/id" }
    get:
      summary: One repository
      x-required-role: viewer
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Repository" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Turn automatic review of a repository on or off
      description: Off by default, because enabling it sends code to an LLM.
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [review_enabled], additionalProperties: false, properties: { review_enabled: { type: boolean } } }
      responses:
        "200":
          description: Updated repository
          content: { application/json: { schema: { $ref: "#/components/schemas/Repository" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/commits:
    get:
      summary: List commits, newest first
      description: Page with `next_cursor` passed back as `cursor` (stable while new rows arrive), or with `offset` for page numbers; not both. `total` counts every match. Each commit shows the score of its latest review.
      x-required-role: viewer
      parameters:
        - { name: repo_id, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: author_id, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ReviewStatus" } }
        - { name: fix, in: query, description: "Fix workflow of the latest review: open = findings left to fix, ready = all fixed and waiting for a reviewer, closed", schema: { type: string, enum: [open, ready, closed] } }
        - { name: branch, in: query, schema: { type: string, maxLength: 200 }, description: Exact branch name }
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: Case-insensitive match on message or hash }
        - { name: since, in: query, schema: { type: string, format: date-time }, description: committed_at >= since }
        - { name: until, in: query, schema: { type: string, format: date-time }, description: committed_at < until }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000000 }, description: Rows to skip; not with cursor }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/CommitPage" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/commits/{id}:
    parameters:
      - { $ref: "#/components/parameters/id" }
    get:
      summary: One commit with its latest review, findings and suggestions
      x-required-role: viewer
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/CommitDetail" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/commits/{id}/rereview:
    parameters:
      - { $ref: "#/components/parameters/id" }
    post:
      summary: Queue the commit for another review
      description: |
        Sets the commit back to `pending` and enqueues a job. 409 when the
        review is running, the repository has review disabled, or it is a
        merge commit. The previous review stays visible until a new one is saved.
      x-required-role: admin
      responses:
        "202":
          description: Queued
          content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [queued] } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/findings/{id}/fixed:
    parameters:
      - { $ref: "#/components/parameters/id" }
    post:
      summary: The author says the finding is fixed
      description: |
        Only the author of the commit or pull request (the user the token belongs
        to) may do this, and only while the finding is `open` and the review is
        not closed. A senior, lead or admin may stand in when the change has no
        linked author, and an admin may do it for anyone (an admin token needs no
        user; what it does is recorded without a name). The optional note says
        what was done.
      x-required-role: author
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { note: { type: string, maxLength: 2000 } } } } }
      responses:
        "200":
          description: Done
          content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [ok] } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/findings/{id}/reopen:
    parameters:
      - { $ref: "#/components/parameters/id" }
    post:
      summary: Send a fixed or dismissed finding back to the author
      description: |
        A senior, lead or admin who is not the author (an admin token without a
        user is allowed too). `note` is required (what is still wrong). On a closed review this reopens the review too.
      x-required-role: senior
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { note: { type: string, maxLength: 2000 } } } } }
      responses:
        "200":
          description: Done
          content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [ok] } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/findings/{id}/dismiss:
    parameters:
      - { $ref: "#/components/parameters/id" }
    post:
      summary: Say the finding is not a real problem
      description: |
        A senior, lead or admin who is not the author. `note` is required (why).
        409 on a closed review.
      x-required-role: senior
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { note: { type: string, maxLength: 2000 } } } } }
      responses:
        "200":
          description: Done
          content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [ok] } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/reviews/{id}/close:
    parameters:
      - { $ref: "#/components/parameters/id" }
    post:
      summary: Close the review
      description: |
        A senior, lead or admin who is not the author. 409 while any finding is
        still `open`, or when the review is already closed.
      x-required-role: senior
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { note: { type: string, maxLength: 2000 } } } } }
      responses:
        "200":
          description: Done
          content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [ok] } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/pull-requests:
    get:
      summary: List pull requests, most recently updated first
      description: |
        Page with `next_cursor` passed back as `cursor` (stable while new rows arrive), or with `offset` for page numbers; not both. `total` counts every match. A pull request is
        reviewed as one diff (all its commits together), separately from its
        commits' own reviews; `score` and `findings` are from its latest review.
        Only pull requests of repositories the poller reads are listed.
      x-required-role: viewer
      parameters:
        - { name: repo_id, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: author_id, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/PullRequestState" } }
        - { name: review_status, in: query, schema: { $ref: "#/components/schemas/ReviewStatus" } }
        - { name: fix, in: query, description: "Fix workflow of the latest review: open = findings left to fix, ready = all fixed and waiting for a reviewer, closed", schema: { type: string, enum: [open, ready, closed] } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: Case-insensitive match on title, source branch or number }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000000 }, description: Rows to skip; not with cursor }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/PullRequestPage" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/pull-requests/{id}:
    parameters:
      - { $ref: "#/components/parameters/id" }
    get:
      summary: One pull request with its latest review, findings and suggestions
      x-required-role: viewer
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/PullRequestDetail" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/pull-requests/{id}/rereview:
    parameters:
      - { $ref: "#/components/parameters/id" }
    post:
      summary: Queue the pull request for another review
      description: |
        Sets it back to `pending` and enqueues a job. 409 when a review is
        running, the repository has review disabled, or the pull request is no
        longer open. The previous review stays visible until a new one is saved.
      x-required-role: admin
      responses:
        "202":
          description: Queued
          content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [queued] } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/audit:
    get:
      summary: The audit log, newest first
      description: |
        Every change made through the API: findings fixed, sent back or dismissed, reviews closed or
        reopened, review switched on or off for a repository, re-reviews asked for. Entries are written in
        the same transaction as the change and are never edited or removed by the application.
        `actor.id` and `actor.name` are null for a token that is not linked to a user; `actor.role` is always set.
        `detail` carries context such as `note`, `commit_id` / `pull_request_id` / `review_id`.
      x-required-role: admin
      parameters:
        - { name: actor_id, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: action, in: query, schema: { type: string, maxLength: 200 }, description: "An action such as `finding.fixed`, or a group such as `finding` (matches `finding.*`)" }
        - { name: subject_type, in: query, schema: { type: string, enum: [finding, review, commit, pull_request, repository] } }
        - { name: subject_id, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/offset" }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/AuditPage" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/users:
    get:
      summary: List people with review statistics for the last N days
      description: "`email` is only returned to admin tokens."
      x-required-role: viewer
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: Case-insensitive match on name or nickname }
        - { name: sort, in: query, schema: { type: string, enum: [name, commits, score], default: name } }
        - { $ref: "#/components/parameters/days" }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/offset" }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/UserPage" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/users/{id}:
    parameters:
      - { $ref: "#/components/parameters/id" }
    get:
      summary: One person with a weekly trend
      description: "`email` is only returned to admin tokens. Weeks without commits are omitted from `trend`."
      x-required-role: viewer
      parameters:
        - { $ref: "#/components/parameters/days" }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/UserDetail" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  parameters:
    id: { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    days: { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 }, description: Window in UTC days, today included }
  responses:
    BadRequest: { description: Invalid parameter, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unauthorized: { description: Missing or invalid token, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: Token role is not allowed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Conflict: { description: State does not allow it, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string }, message: { type: string } }
    ReviewStatus: { type: string, enum: [pending, running, done, skipped, failed] }
    Severity: { type: string, enum: [critical, major, minor, info] }
    Overview:
      type: object
      properties:
        days: { type: integer }
        since: { type: string, format: date-time }
        commits: { type: integer }
        commits_by_status: { type: object, additionalProperties: { type: integer } }
        reviewed: { type: integer, description: Commits that have a review }
        avg_score: { type: number, nullable: true }
        usage:
          type: object
          description: |
            Review runs created in the window, re-reviews included (cost is per run).
            `measured_runs` counts runs that reported usage; mock runs report none and add nothing to the sums.
            Tokens are everything sent to / returned by the model (cached input included);
            cost is the provider-reported figure, in USD.
          properties:
            runs: { type: integer }
            measured_runs: { type: integer }
            tokens_in: { type: integer, format: int64 }
            tokens_out: { type: integer, format: int64 }
            cost_usd: { type: number }
            avg_cost_usd: { type: number, nullable: true, description: Mean over measured runs of stored reviews }
            wasted:
              type: object
              description: |
                Attempts in the window that did not end in a stored review (failed, retried).
                Their tokens and cost are already included in the totals above.
              properties:
                runs: { type: integer }
                measured_runs: { type: integer }
                tokens_in: { type: integer, format: int64 }
                tokens_out: { type: integer, format: int64 }
                cost_usd: { type: number }
        findings_by_severity: { type: object, additionalProperties: { type: integer }, description: Findings of each commit's latest review }
        queue_waiting: { type: integer }
        queue_running: { type: integer }
        active_repositories: { type: integer }
        active_authors: { type: integer }
        enabled_repositories: { type: integer }
        total_repositories: { type: integer }
        fix:
          type: object
          description: Fix workflow of the latest reviews of the commits in the window
          properties:
            open_findings: { type: integer, description: Waiting for the author }
            fixed_findings: { type: integer, description: Fixed by the author, review not closed yet }
            reviews_ready_to_close: { type: integer, description: Every finding fixed or dismissed, waiting for a senior, lead or admin }
            reviews_closed: { type: integer }
        series:
          type: array
          items:
            type: object
            properties:
              day: { type: string, format: date }
              commits: { type: integer }
              reviewed: { type: integer }
              avg_score: { type: number, nullable: true }
              cost_usd: { type: number, description: Cost of review runs created that day }
    Repository:
      type: object
      properties:
        id: { type: integer, format: int64 }
        workspace: { type: string }
        project_key: { type: string }
        project_name: { type: string }
        slug: { type: string }
        name: { type: string }
        full_name: { type: string }
        main_language: { type: string, nullable: true }
        default_branch: { type: string, nullable: true }
        review_enabled: { type: boolean }
        commits: { type: integer }
        reviewed: { type: integer }
        avg_score: { type: number, nullable: true }
        last_commit_at: { type: string, format: date-time, nullable: true }
    RepositoryPage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Repository" } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    CommitSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        hash: { type: string }
        subject: { type: string, description: First line of the message }
        repository:
          type: object
          properties: { id: { type: integer, format: int64 }, full_name: { type: string } }
        author:
          type: object
          description: "`id` is null for authors known only from the git author string."
          properties:
            id: { type: integer, format: int64, nullable: true }
            name: { type: string }
            avatar_url: { type: string, nullable: true }
        branch: { type: string, nullable: true }
        committed_at: { type: string, format: date-time }
        review_status: { $ref: "#/components/schemas/ReviewStatus" }
        review_skip_reason: { type: string, nullable: true }
        files_changed: { type: integer, nullable: true }
        additions: { type: integer, nullable: true }
        deletions: { type: integer, nullable: true }
        is_merge: { type: boolean }
        score: { type: integer, nullable: true, minimum: 0, maximum: 100 }
        findings: { type: integer }
        reviewed_at: { type: string, format: date-time, nullable: true }
        open_findings: { type: integer, description: Findings of the latest review that are still open (the author has to fix them) }
        review_closed: { type: boolean, description: A senior, lead or admin closed the latest review }
    PullRequestState:
      type: string
      enum: [OPEN, MERGED, DECLINED, SUPERSEDED, DELETED]
      description: Bitbucket's state; `DELETED` means Bitbucket no longer knows the pull request.
    PullRequestSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        number: { type: integer, description: The pull request id in Bitbucket }
        title: { type: string }
        repository:
          type: object
          properties: { id: { type: integer, format: int64 }, full_name: { type: string } }
        author:
          type: object
          properties:
            id: { type: integer, format: int64, nullable: true }
            name: { type: string }
            avatar_url: { type: string, nullable: true }
        source_branch: { type: string, nullable: true }
        destination_branch: { type: string, nullable: true }
        state: { $ref: "#/components/schemas/PullRequestState" }
        review_status: { $ref: "#/components/schemas/ReviewStatus" }
        review_skip_reason: { type: string, nullable: true }
        files_changed: { type: integer, nullable: true }
        additions: { type: integer, nullable: true }
        deletions: { type: integer, nullable: true }
        score: { type: integer, nullable: true, minimum: 0, maximum: 100 }
        findings: { type: integer }
        reviewed_at: { type: string, format: date-time, nullable: true }
        open_findings: { type: integer, description: Findings of the latest review that are still open (the author has to fix them) }
        review_closed: { type: boolean, description: A senior, lead or admin closed the latest review }
        review_outdated: { type: boolean, description: The branch has new commits since the latest review }
        updated_at: { type: string, format: date-time }
    PullRequestPage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PullRequestSummary" } }
        total: { type: integer, description: Pull requests matching the filters, all pages together }
        next_cursor: { type: string, nullable: true }
    PullRequestDetail:
      allOf:
        - { $ref: "#/components/schemas/PullRequestSummary" }
        - type: object
          properties:
            description: { type: string }
            reviews_count: { type: integer }
            review: { allOf: [{ $ref: "#/components/schemas/Review" }], nullable: true }
            failed_attempts: { $ref: "#/components/schemas/FailedAttempts" }
    CommitPage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CommitSummary" } }
        total: { type: integer, description: Commits matching the filters, all pages together }
        next_cursor: { type: string, nullable: true }
    Suggestion:
      type: object
      properties:
        id: { type: integer, format: int64 }
        original_snippet: { type: string }
        suggested_snippet: { type: string }
        unified_diff: { type: string }
        status: { type: string, enum: [open, accepted, dismissed] }
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        problems: { type: array, items: { type: string }, description: One sentence per problem, written for a person }
        checked_at: { type: string, format: date-time }
        webhooks:
          type: object
          properties:
            unprocessed: { type: integer }
            oldest_age_seconds: { type: integer, nullable: true }
        jobs:
          type: object
          description: Webhook and review jobs
          properties:
            waiting: { type: integer }
            running: { type: integer }
            retrying: { type: integer }
            snoozed: { type: integer, description: Waiting for a rate limit or usage limit to pass }
            discarded_24h: { type: integer }
            oldest_waiting_seconds: { type: integer, nullable: true }
        stuck:
          type: object
          description: Marked as waiting or running but with no job behind them. The worker's next background check queues them again.
          properties:
            commits: { type: integer }
            pull_requests: { type: integer }
        last_poll:
          nullable: true
          type: object
          properties:
            at: { type: string, format: date-time }
            ok: { type: boolean }
        last_reconcile:
          nullable: true
          type: object
          properties:
            at: { type: string, format: date-time }
            events: { type: integer }
            commits: { type: integer }
            pull_requests: { type: integer }
            gave_up: { type: integer }
    Finding:
      type: object
      properties:
        id: { type: integer, format: int64 }
        file_path: { type: string }
        line_start: { type: integer }
        line_end: { type: integer }
        severity: { $ref: "#/components/schemas/Severity" }
        category: { type: string }
        title: { type: string }
        explanation: { type: string }
        code_context:
          type: string
          nullable: true
          description: The diff hunk the finding is about (unified-diff lines). Null for reviews made before this was recorded.
        suggestion: { allOf: [{ $ref: "#/components/schemas/Suggestion" }], nullable: true }
        status: { type: string, enum: [open, fixed, dismissed], description: "`fixed` = the author says so, waiting for a reviewer" }
        status_by: { allOf: [{ $ref: "#/components/schemas/UserRef" }], nullable: true }
        status_note: { type: string, nullable: true }
        status_at: { type: string, format: date-time, nullable: true }
        history:
          type: array
          description: Every change since the review, oldest first
          items:
            type: object
            properties:
              action: { type: string, enum: [fixed, reopened, dismissed] }
              by: { allOf: [{ $ref: "#/components/schemas/UserRef" }], nullable: true }
              note: { type: string, nullable: true }
              at: { type: string, format: date-time }
    UserRef:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    Review:
      type: object
      properties:
        id: { type: integer, format: int64 }
        model: { type: string, description: "`mock` marks results that did not come from a real model" }
        prompt_version: { type: string }
        score: { type: integer, nullable: true }
        summary: { type: string }
        duration_ms: { type: integer, nullable: true }
        tokens_in: { type: integer, nullable: true, description: Null when the reviewer reported no usage }
        tokens_out: { type: integer, nullable: true }
        cost_usd: { type: number, nullable: true }
        created_at: { type: string, format: date-time }
        closed:
          nullable: true
          description: Set once a senior, lead or admin closed the review
          type: object
          properties:
            at: { type: string, format: date-time }
            by: { allOf: [{ $ref: "#/components/schemas/UserRef" }], nullable: true }
            note: { type: string, nullable: true }
        findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
    CommitDetail:
      allOf:
        - { $ref: "#/components/schemas/CommitSummary" }
        - type: object
          properties:
            message: { type: string }
            reviews_count: { type: integer }
            review: { allOf: [{ $ref: "#/components/schemas/Review" }], nullable: true }
            failed_attempts: { $ref: "#/components/schemas/FailedAttempts" }
    FailedAttempts:
      type: object
      description: Review attempts that did not end in a stored review (failed, retried). Count 0 means none.
      properties:
        count: { type: integer }
        measured: { type: integer, description: Attempts that reported usage }
        tokens_in: { type: integer, format: int64 }
        tokens_out: { type: integer, format: int64 }
        cost_usd: { type: number }
        last_error: { type: string, nullable: true }
        last_at: { type: string, format: date-time, nullable: true }
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        display_name: { type: string }
        nickname: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }
        email: { type: string, description: Admin tokens only }
        job_title: { type: string, nullable: true }
        department: { type: string, nullable: true }
        linked: { type: boolean, description: False for people known only from a raw git author }
        commits: { type: integer, description: Commits in the window }
        reviewed: { type: integer }
        avg_score: { type: number, nullable: true, description: Mean of each commit's latest review score }
        findings: { type: integer }
    AuditEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor:
          type: object
          properties:
            id: { type: integer, format: int64, nullable: true }
            name: { type: string, nullable: true, description: The name when it happened }
            role: { type: string }
        action: { type: string, example: finding.fixed }
        subject:
          type: object
          properties:
            type: { type: string, enum: [finding, review, commit, pull_request, repository] }
            id: { type: integer, format: int64 }
        detail: { type: object, additionalProperties: true }
    AuditPage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    UserPage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/User" } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    UserDetail:
      allOf:
        - { $ref: "#/components/schemas/User" }
        - type: object
          properties:
            days: { type: integer }
            trend:
              type: array
              items:
                type: object
                properties:
                  week: { type: string, format: date, description: Monday of the ISO week (UTC) }
                  commits: { type: integer }
                  reviewed: { type: integer }
                  avg_score: { type: number, nullable: true }
